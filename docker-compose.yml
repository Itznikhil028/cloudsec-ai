services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cloudsec-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - cloudsec-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cloudsec-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - cloudsec-network

networks:
  cloudsec-network:
    driver: bridge
